[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lxnet"
version = "1.0.0"
description = "Lung disease classification from chest X-rays with near-duplicate-aware evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "baveshraam" }]
keywords = ["chest-xray", "medical-imaging", "cnn", "data-leakage", "xai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# TF 2.10 is the last release with native Windows GPU support, which is what this
# was trained on. Pinned exactly: 2.11+ silently drops to CPU on Windows.
dependencies = [
    "tensorflow==2.10.1",
    "numpy>=1.23,<2.0",
    "opencv-python>=4.7",
    "pillow>=9.0",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "pandas>=1.5",
]

[project.optional-dependencies]
xai = ["lime>=0.2.0.1", "scikit-image>=0.19"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[project.scripts]
lxnet-train = "lxnet.train:main"
lxnet-predict = "lxnet.predict:main"
lxnet-report = "lxnet.report:main"
lxnet-explain = "lxnet.explain:main"

[project.urls]
Repository = "https://github.com/baveshraam/LXNet"
Results = "https://github.com/baveshraam/LXNet/blob/main/docs/RESULTS.md"
"Model card" = "https://github.com/baveshraam/LXNet/blob/main/docs/MODEL_CARD.md"

[tool.setuptools]
packages = ["lxnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download weights or train (deselect with '-m \"not slow\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["lxnet"]
omit = ["lxnet/report.py"]  # figure rendering; exercised by tests, not line-covered

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise SystemExit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E402",  # matplotlib.use("Agg") must precede the pyplot import
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
